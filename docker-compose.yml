version: '3.8'
services:
  # ===== AingTalk Server =====
  agent-server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HEARTBEAT_TIMEOUT=90000
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== Worker (mcp-server full 模式) =====
  # 接收远程任务 + 提供本地 MCP 工具
  agent-worker:
    build: ./worker
    depends_on:
      agent-server:
        condition: service_healthy
    environment:
      - AINGTALK_SERVER_URL=http://agent-server:3000
      - AGENT_NAME=docker-worker
      - AINGTALK_MODE=full
    volumes:
      - worker-received:/app/received
      - worker-task-results:/app/task-results
    restart: unless-stopped

volumes:
  uploads:
  worker-received:
  worker-task-results:
